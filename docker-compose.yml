services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "26526:26526" 
    depends_on:
      # - game
      # - room
      - userdata
    networks:
      - game-net

  # game:
  #   build: ./game
  #   container_name: game
  #   networks:
  #     - game-net

  # room:
  #   build: ./room
  #   container_name: room
  #   networks:
  #     - game-net

  userdata:
    build: ./userData   
    container_name: userdata
    networks:
      - game-net
    depends_on:
      - mysql
      - redis

  # test:
  #   build: ./test
  #   container_name: test
  #   depends_on:
  #     - game
  #     - room
  #     - userdata
  #     - gateway
  #   networks:
  #     - game-net

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - game-net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - game-net
      
networks:
  game-net:
    driver: bridge