services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "26526:26526"
      - "26527:26527"
    expose:
      - "9091"
    depends_on:
      - room
      - userdata
    networks:
      - game-net
    environment:
      - REDIS_ADDR=redis:6379

  # game:
  #   build: ./game
  #   container_name: game
  #   networks:
  #     - game-net

  room:
    build: ./room
    container_name: room
    ports:
      - "26528:26528"
    expose:
      - "9091"
    networks:
      - game-net
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  userdata:
    build:
      context: ./userData
      dockerfile: Dockerfile
    container_name: userdata
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "26529:26529"
    expose:
      - "9091"
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - game-net

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - game-net

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - game-net

  redis:
    image: redis:latest
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - game-net

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - game-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - game-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - game-net

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
  redisinsight_data:

networks:
  game-net:
    driver: bridge
