spring:
  application:
    name: userdata

  datasource:
    url: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?connectTimeout=${MYSQL_CONNECT_TIMEOUT_MS:3000}&socketTimeout=${MYSQL_SOCKET_TIMEOUT_MS:5000}"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${MYSQL_POOL_VALIDATION_TIMEOUT_MS:2000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      # Jakarta Persistence query timeout is in milliseconds.
      jakarta.persistence.query.timeout: ${MYSQL_QUERY_TIMEOUT_MS:3000}

  grpc:
    server:
      port: 26529

  # data:
  #   redis:
  #     host: redis
  #     port: 6379

userdata:
  database:
    # Keep max-concurrency aligned with spring.datasource.hikari.maximum-pool-size.
    max-concurrency: ${USERDATA_DATABASE_MAX_CONCURRENCY:10}
    acquire-timeout: ${USERDATA_DATABASE_ACQUIRE_TIMEOUT:1s}
    max-waiters: ${USERDATA_DATABASE_MAX_WAITERS:10}
  password-hash:
    # 0 disables the execution limit for an unconstrained benchmark baseline.
    max-concurrency: ${USERDATA_PASSWORD_HASH_MAX_CONCURRENCY:10}
    acquire-timeout: ${USERDATA_PASSWORD_HASH_ACQUIRE_TIMEOUT:5s}
    max-waiters: ${USERDATA_PASSWORD_HASH_MAX_WAITERS:100}


management:
  server:
    port: 9091
  metrics:
    distribution:
      percentiles-histogram:
        userdata.grpc.server.requests: true
        userdata.password.operation: true
        userdata.password.permit.wait: true
        userdata.database.operation: true
        userdata.database.permit.wait: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
