spring:
  application:
    name: userdata

  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  grpc:
    server:
      port: 26529

  # data:
  #   redis:
  #     host: redis
  #     port: 6379

userdata:
  password-hash:
    # 0 disables the execution limit for an unconstrained benchmark baseline.
    max-concurrency: ${USERDATA_PASSWORD_HASH_MAX_CONCURRENCY:10}
    acquire-timeout: ${USERDATA_PASSWORD_HASH_ACQUIRE_TIMEOUT:5s}
    max-waiters: ${USERDATA_PASSWORD_HASH_MAX_WAITERS:100}


management:
  server:
    port: 9091
  metrics:
    distribution:
      percentiles-histogram:
        userdata.grpc.server.requests: true
        userdata.password.operation: true
        userdata.password.permit.wait: true
        userdata.database.operation: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      access: unrestricted
