global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:9091"]

  - job_name: "room"
    static_configs:
      - targets: ["room:9091"]

  - job_name: "userdata"
    scrape_interval: 1s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["userdata:9091"]

  # - job_name: "game"
  #   static_configs:
  #     - targets: ["game:9091"]
